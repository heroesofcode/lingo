name: Linux build dependencies
description: >-
  The system libraries Lingo links against: GTK 4 for the window, and OpenSSL
  for the TLS under the OpenAI connections (reqwest and tokio-tungstenite use
  native-tls).

runs:
  using: composite
  steps:
    - name: Install system libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev libssl-dev
