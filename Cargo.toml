[package]
name = "lingo"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Live translation and reply suggestions for calls, on Linux (GTK4 + PipeWire)"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-channel = "2.5.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
gtk = { version = "0.11", package = "gtk4", features = ["v4_14", "gio_v2_80"] }
indexmap = "2.14.2"
log = "0.4.34"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
toml = "1.1.7"

[profile.release]
lto = "thin"
strip = true
